name: Security and Foundation Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit

      - name: Compile Python sources
        run: |
          python -m compileall -q agents config.py logging_config.py main.py memory notifications system_checks.py tools workflows privacy_bootstrap.py

      - name: Container boundary unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: System regression verification
        env:
          API_SECRET_KEY: "ci-local-regression-placeholder-1234567890"
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          SANDBOX_MODE: "true"
          ALLOW_UNSAFE_RAW_SHELL: "false"
        run: python verify_system.py

      - name: Bandit medium/high findings
        if: ${{ always() }}
        run: bandit -r agents memory notifications tools workflows main.py config.py system_checks.py -ll

      - name: Audit Python dependencies
        if: ${{ always() }}
        run: pip-audit

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: executive-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: executive-dashboard/package-lock.json

      - name: Install exact frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        if: ${{ always() }}
        run: npm run build

      - name: Audit production npm dependencies
        if: ${{ always() }}
        run: npm audit --omit=dev --audit-level=high

      - name: Audit high/critical npm vulnerabilities
        if: ${{ always() }}
        run: npm audit --audit-level=high
