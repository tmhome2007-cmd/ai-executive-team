name: Code maintenance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formatting-and-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: executive-dashboard/package-lock.json
      - run: python -m pip install -r requirements-maintenance.txt
      - run: npm ci --ignore-scripts
        working-directory: executive-dashboard
      - run: python scripts/maintain_code.py check
